name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Rules-only scan of the sample app
        run: python -m codewarden scan vulnerable-app --provider none --project "CDF TaskFlow" --out ci-report
      - name: Benchmark (rules-only)
        run: python eval/run_eval.py
      - uses: actions/upload-artifact@v4
        with:
          name: codewarden-ci-report
          path: ci-report/
